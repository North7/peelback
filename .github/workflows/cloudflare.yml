name: Deploy to Cloudflare Pages

# peelback.aronlab.dev：把 public/（build 好的單頁）部署到 Cloudflare Pages。
# 觸發：push 到 main、手動 workflow_dispatch。
# 需要倉庫 Secrets：CLOUDFLARE_API_TOKEN（Account › Cloudflare Pages › Edit）、CLOUDFLARE_ACCOUNT_ID；還沒設定時直接略過。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

env:
  PROJECT: peelback
  DOMAIN: peelback.aronlab.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Secrets 還沒設定就略過
        if: env.HAS_TOKEN != 'true'
        run: echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 還沒設定，這次不部署。"

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - name: 確認 Pages 專案存在（第一次會建立）
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ env.PROJECT }} --production-branch=main

      - name: 部署
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=${{ env.PROJECT }} --branch=main --commit-dirty=true

      # 第一次：把 peelback.aronlab.dev 綁到這個 Pages 專案（已經綁過會回錯誤，忽略）
      - name: 綁自訂網域
        if: env.HAS_TOKEN == 'true'
        continue-on-error: true
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/${PROJECT}/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" -H "Content-Type: application/json" \
            --data "{\"name\":\"${DOMAIN}\"}" | head -c 600; echo
