<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Noto+Sans+TC:wght@600;800&display=swap">
<link rel="stylesheet" href="mock.css">
<style>
body{display:grid;grid-template-columns:1fr 1fr;gap:0;width:1600px;height:900px;overflow:hidden}
.p{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:56px;position:relative}
.p.l{--bg:#f3f1ea;--ink:#141513;--ink2:#6f716b;--acc:#16b98a;background:var(--bg);color:var(--ink)}
.p.d{--bg:#070808;--ink:#ecede8;--ink2:#8f948f;--acc:#3fe0b2;background:var(--bg);color:var(--ink)}
.big svg{width:300px;height:300px}
.row{display:flex;gap:40px;align-items:center}
.icon{width:120px;height:120px;border-radius:28px;display:grid;place-items:center;background:var(--ink)}
.icon svg{width:84px;height:84px}
.icon.a{background:#0d1010;--ink:#ecede8;--acc:#3fe0b2;--bg:#0d1010}
.icon.b{background:#3fe0b2;--ink:#062018;--acc:#f3f1ea;--bg:#3fe0b2}
.big svg{overflow:visible}
.p .logo .mark{width:56px;height:56px}.p .logo .word b{font-size:32px}.p .logo .word span{font-size:15px}
.lab{position:absolute;left:28px;top:24px;font:500 11px var(--f-mono);letter-spacing:.12em;color:var(--ink2)}
</style></head><body>
<div class="p d"><span class="lab">DARK</span><div class="big" id="m1"></div><div class="row"><div class="icon a" id="i1"></div><div class="icon b" id="i2"></div><div id="w1"></div></div></div>
<div class="p l"><span class="lab">LIGHT</span><div class="big" id="m2"></div><div class="row"><div id="w2"></div></div></div>
<script src="logo.bundle.js"></script></body></html>
